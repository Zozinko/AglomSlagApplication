# Independent project name is generated by Run-ApiTests.ps1. No host database port,
# shared network, existing container name or persistent database volume is used.
services:
  postgres:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${API_TEST_DB_PASSWORD:?Use Run-ApiTests.ps1}
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../Soft/docker/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  migrator:
    build:
      context: ../Soft
      dockerfile: docker/migrator/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: ${API_TEST_DB_PASSWORD:?Use Run-ApiTests.ps1}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ../Soft
      dockerfile: docker/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      JWT_SIGNING_KEY: ${API_TEST_JWT_KEY:?Use Run-ApiTests.ps1}
      JWT_ISSUER: aglom-tests
      JWT_AUDIENCE: aglom-test-clients
      JWT_ACCESS_SECONDS: '900'
      JWT_CLOCK_SKEW_SECONDS: '0'
      AUTH_LOGIN_LIMIT: '1000'
      DEMO_BOOTSTRAP: 'true'
      DEMO_USER_EMAIL: ${API_TEST_USER_EMAIL:?Use Run-ApiTests.ps1}
      DEMO_USER_PASSWORD: ${API_TEST_USER_PASSWORD:?Use Run-ApiTests.ps1}
      DEMO_ADMIN_EMAIL: ${API_TEST_ADMIN_EMAIL:?Use Run-ApiTests.ps1}
      DEMO_ADMIN_PASSWORD: ${API_TEST_ADMIN_PASSWORD:?Use Run-ApiTests.ps1}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: ${API_TEST_DB_PASSWORD:?Use Run-ApiTests.ps1}
    ports:
      - '127.0.0.1::8080'
    depends_on:
      migrator:
        condition: service_completed_successfully
