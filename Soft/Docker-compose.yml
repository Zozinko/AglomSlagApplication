x-database: &database
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_USER: ${DB_USER:?Set DB_USER in Soft/.env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Soft/.env}

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: aglom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in Soft/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Soft/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agloslag_network
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  migrator:
    build:
      context: .
      dockerfile: docker/migrator/Dockerfile
    container_name: aglom_migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment: *database
    networks:
      - agloslag_network
    restart: "no"

  graphql-api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: aglom_graphql_api
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      <<: *database
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      JWT_ISSUER: ${JWT_ISSUER:-aglomslag-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-aglomslag-clients}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in Soft/.env}
      JWT_ACCESS_SECONDS: ${JWT_ACCESS_SECONDS:-300}
      JWT_CLOCK_SKEW_SECONDS: ${JWT_CLOCK_SKEW_SECONDS:-5}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      DEMO_BOOTSTRAP: ${DEMO_BOOTSTRAP:-true}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-user@example.invalid}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in Soft/.env}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.invalid}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD in Soft/.env}
    ports:
      - "5000:8080"
    networks:
      - agloslag_network
    restart: unless-stopped

  bootstrap:
    profiles: [setup]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: [--bootstrap-demo]
    environment:
      <<: *database
      JWT_ISSUER: ${JWT_ISSUER:-aglomslag-local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-aglomslag-clients}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in Soft/.env}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_NAME: ${BOOTSTRAP_NAME:-}
      TARGET_USER_ID: ${TARGET_USER_ID:-}
      NEW_PASSWORD: ${NEW_PASSWORD:-}
    networks:
      - agloslag_network
    depends_on:
      migrator:
        condition: service_completed_successfully

networks:
  agloslag_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
