query CalcVariants {
  calcVariants {
    variantId bfId calcDate saveTime variantName isImport
    cokeConsumption cokeSContent cokeAshAmount cokeAshCaOContent cokeAshSiO2Content cokeAshAl2O3Content cokeAshMgOContent
    slagSContent slagCaOContent slagSiO2Content slagTiO2Content slagAl2O3Content slagMgOContent
    ciTemperature ciSiContent ciSContent ciMnContent ciCContent ciTiContent ciCrContent
    blastFurnace { bfId bfName }
    parentId
    componentVariants {
      variantId componentId componentName consumption feContent siO2Content al2O3Content caOContent mgOContent sContent mnOContent tiO2Content
    }
  }
}
